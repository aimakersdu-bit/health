spring:
  application:
    name: health-check-demo
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/healthdb
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:secret}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    # Minimal config to allow app to start without a real broker, though plugin will fail if connected
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState, livenessPluginIndicator
        readiness:
          include: readinessState, readinessPluginIndicator
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

health:
  plugin:
    diagnostics:
      path: target/diagnostics # Use target for safe write in dev/test
